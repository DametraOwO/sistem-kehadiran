<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Maintenance - Madrasah Al-Hidayah</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#14b881",
                        "primary-dark": "#0f8c61",
                        "background-light": "#f6f8f7",
                        "surface-light": "#ffffff",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        .islamic-pattern {
            background-color: #14b881;
            background-image:
                radial-gradient(circle at 100% 0%, rgba(255, 255, 255, 0.15) 15%, transparent 20%),
                radial-gradient(circle at 0% 100%, rgba(255, 255, 255, 0.1) 15%, transparent 20%),
                linear-gradient(45deg, rgba(255, 255, 255, 0.05) 25%, transparent 25%, transparent 50%, rgba(255, 255, 255, 0.05) 50%, rgba(255, 255, 255, 0.05) 75%, transparent 75%, transparent);
            background-size: 100% 100%, 100% 100%, 40px 40px;
        }
    </style>
</head>

<body class="bg-background-light font-display text-slate-800 flex items-center justify-center min-h-screen p-4">

    <div
        class="max-w-md w-full bg-surface-light rounded-3xl shadow-soft border border-slate-100 overflow-hidden text-center relative">
        <div class="h-32 islamic-pattern w-full absolute top-0 left-0 z-0"></div>

        <div class="relative z-10 pt-20 px-6 pb-8 flex flex-col items-center">
            <div
                class="w-20 h-20 bg-white rounded-full flex items-center justify-center shadow-lg mb-4 border-4 border-white">
                <span class="material-symbols-outlined text-primary text-4xl">construction</span>
            </div>

            <h1 class="text-2xl font-bold mb-2 text-slate-900">Dalam Pengembangan</h1>
            <p class="text-slate-500 mb-8 leading-relaxed">
                Mohon maaf, fitur ini sedang dalam tahap pengembangan dan penyempurnaan. Silakan kembali lagi nanti.
            </p>

            <button onclick="history.back()"
                class="w-full py-3 bg-primary hover:bg-primary-dark text-white font-bold rounded-xl transition-all shadow-lg shadow-primary/20 flex items-center justify-center gap-2">
                <span class="material-symbols-outlined">arrow_back</span>
                Kembali
            </button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/security.js') }}"></script>
</body>

</html>
