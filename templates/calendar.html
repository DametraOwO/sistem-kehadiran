<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Kalender Akademik - Madrasah Al-Hidayah</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#14b881",
                        "primary-dark": "#0f8c61",
                        "background-light": "#f6f8f7",
                        "background-dark": "#11211c",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1a2c26",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "3xl": "1.5rem", "full": "9999px" },
                    boxShadow: {
                        "soft": "0 4px 20px -2px rgba(0, 0, 0, 0.05)",
                        "card": "0 2px 8px -2px rgba(20, 184, 129, 0.1)",
                        "glow": "0 0 15px rgba(20, 184, 129, 0.3)"
                    }
                },
            },
        }
    </script>
    <style>
        .islamic-pattern {
            background-color: #14b881;
            background-image:
                radial-gradient(circle at 100% 0%, rgba(255, 255, 255, 0.15) 15%, transparent 20%),
                radial-gradient(circle at 0% 100%, rgba(255, 255, 255, 0.1) 15%, transparent 20%),
                linear-gradient(45deg, rgba(255, 255, 255, 0.05) 25%, transparent 25%, transparent 50%, rgba(255, 255, 255, 0.05) 50%, rgba(255, 255, 255, 0.05) 75%, transparent 75%, transparent);
            background-size: 100% 100%, 100% 100%, 40px 40px;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
    <style>
        body {
            min-height: max(900px, 100dvh);
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark font-display text-slate-800 dark:text-slate-100 antialiased overflow-x-hidden pb-24 selection:bg-primary selection:text-white">

    <!-- GREEN HEADER SECTION -->
    <div class="relative w-full islamic-pattern pt-12 pb-20 px-5">

        <div class="relative z-10">
            <!-- Top Bar -->
            <div class="flex items-center justify-between mb-8">
                <div class="flex items-center gap-3">
                    <div class="bg-white/20 backdrop-blur-sm p-2 rounded-xl border border-white/10">
                        <span class="material-symbols-outlined text-white" style="font-size: 28px;">mosque</span>
                    </div>
                    <div class="flex flex-col">
                        <p class="text-white/80 text-xs font-medium tracking-wider uppercase">Madrasah</p>
                        <p class="text-white text-lg font-bold leading-none tracking-tight">Al-Hidayah</p>
                    </div>
                </div>
                <button
                    class="w-10 h-10 bg-white/20 hover:bg-white/30 rounded-full flex items-center justify-center backdrop-blur-sm transition-colors relative">
                    <span class="material-symbols-outlined text-white">notifications</span>
                    <span
                        class="absolute top-2.5 right-2.5 w-2 h-2 bg-red-400 rounded-full border border-white/20"></span>
                </button>
            </div>

            <!-- Title & Subtitle -->
            <div class="flex flex-col gap-1 mb-6">
                <h1 class="text-white text-2xl font-bold tracking-tight">Kalender Akademik</h1>
                <p class="text-white/90 text-sm font-medium opacity-90">Mei 2024 • Semester Genap</p>
            </div>

            <!-- Class Selection Dropdown -->
            <div class="relative">
                <div class="relative">
                    <span
                        class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-white/80 text-[20px] pointer-events-none">school</span>
                    <select id="class-filter"
                        class="w-full appearance-none bg-white/20 backdrop-blur-md border border-white/10 rounded-xl pl-12 pr-10 py-3 text-white font-bold text-sm cursor-pointer hover:bg-white/30 transition-colors focus:outline-none focus:ring-2 focus:ring-white/20 [&>option]:text-slate-800">
                        <option value="">Kalender Umum</option>
                        {% for k in kelas_list %}
                        <option value="{{ k.nama_kelas }}">{{ k.nama_kelas }}</option>
                        {% endfor %}
                    </select>
                    <span
                        class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-white pointer-events-none">expand_more</span>
                </div>
            </div>
        </div>
    </div>

    <!-- MAIN CARD CONTAINER (Overlapping) -->
    <main class="relative z-20 -mt-10 px-0">
        <div class="bg-white dark:bg-surface-dark rounded-t-[32px] shadow-lg min-h-screen px-5 pt-2 pb-24">

            <!-- Month Navigation -->
            <div class="flex items-center justify-between py-6">
                <button id="prev-month-btn"
                    class="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-slate-800 dark:hover:text-white transition-colors">
                    <span class="material-symbols-outlined">chevron_left</span>
                </button>
                <h2 id="month-display" class="text-xl font-bold text-slate-800 dark:text-white text-center">Loading...
                </h2>
                <button id="next-month-btn"
                    class="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-slate-800 dark:hover:text-white transition-colors">
                    <span class="material-symbols-outlined">chevron_right</span>
                </button>
            </div>

            <!-- Calendar Grid -->
            <!-- Day Names -->
            <div class="grid grid-cols-7 gap-1 text-center mb-2">
                <div class="text-xs font-bold text-red-500">Ahd</div>
                <div class="text-xs font-bold text-slate-500">Sen</div>
                <div class="text-xs font-bold text-slate-500">Sel</div>
                <div class="text-xs font-bold text-slate-500">Rab</div>
                <div class="text-xs font-bold text-slate-500">Kam</div>
                <div class="text-xs font-bold text-slate-500">Jum</div>
                <div class="text-xs font-bold text-slate-500">Sab</div>
            </div>

            <!-- Days -->
            <div id="calendar-grid"
                class="grid grid-cols-7 gap-y-6 gap-x-1 text-center text-sm font-medium text-slate-800 dark:text-white relative min-h-[400px]">
                <!-- Grid Content will be injected by JS -->
                <div class="col-span-7 flex items-center justify-center text-slate-400">Loading Calendar...</div>
            </div>

            <!-- Holiday List -->
            <div id="holiday-list" class="mt-8 flex flex-col gap-2 px-1">
                <!-- Holidays will be injected here -->
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav
        class="fixed bottom-0 w-full bg-surface-light/80 dark:bg-surface-dark/80 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 pb-safe pt-2 px-6 flex justify-between items-center z-50 h-20">
        <a class="flex flex-col items-center gap-1 group w-16" href="{{ url_for('index') }}">
            <span
                class="material-symbols-outlined text-slate-400 text-[28px] group-hover:text-primary transition-colors">home</span>
            <span
                class="text-[10px] font-medium text-slate-500 group-hover:text-primary transition-colors">Beranda</span>
        </a>
        <a class="flex flex-col items-center gap-1 group w-16" href="{{ url_for('calendar') }}">
            <!-- Active State -->
            <span
                class="material-symbols-outlined text-primary text-[28px] group-hover:scale-110 transition-transform fill-current">calendar_month</span>
            <span class="text-[10px] font-bold text-primary">Jadwal</span>
        </a>
        <a class="flex flex-col items-center gap-1 group w-16" href="{{ url_for('about') }}">
            <span
                class="material-symbols-outlined text-slate-400 text-[28px] group-hover:text-primary transition-colors">info</span>
            <span
                class="text-[10px] font-medium text-slate-500 group-hover:text-primary transition-colors">Tentang</span>
        </a>
    </nav>
    <script src="{{ url_for('static', filename='js/calendar.js') }}"></script>
</body>

</html>
