<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Kalender Akademik - Madrasah Al-Hidayah</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#14b881",
                        "primary-dark": "#0f8c61",
                        "background-light": "#f6f8f7",
                        "surface-light": "#ffffff",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "3xl": "1.5rem", "full": "9999px" },
                    boxShadow: {
                        "soft": "0 4px 20px -2px rgba(0, 0, 0, 0.05)",
                        "card": "0 2px 8px -2px rgba(20, 184, 129, 0.1)",
                        "glow": "0 0 15px rgba(20, 184, 129, 0.3)"
                    }
                },
            },
        }
    </script>
    <style>
        .islamic-pattern {
            background-color: #14b881;
            background-image:
                radial-gradient(circle at 100% 0%, rgba(255, 255, 255, 0.15) 15%, transparent 20%),
                radial-gradient(circle at 0% 100%, rgba(255, 255, 255, 0.1) 15%, transparent 20%),
                linear-gradient(45deg, rgba(255, 255, 255, 0.05) 25%, transparent 25%, transparent 50%, rgba(255, 255, 255, 0.05) 50%, rgba(255, 255, 255, 0.05) 75%, transparent 75%, transparent);
            background-size: 100% 100%, 100% 100%, 40px 40px;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
    <style>
        body {
            min-height: max(900px, 100dvh);
        }
    </style>
</head>

<body
    class="bg-background-light font-display text-slate-800 antialiased overflow-x-hidden pb-24 selection:bg-primary selection:text-white">

    <!-- GREEN HEADER SECTION -->
    <div class="relative w-full islamic-pattern pt-12 pb-24 px-5">
        <div class="relative z-10">
            <!-- Top Bar -->
            <div class="flex items-center justify-between mb-8">
                <div class="flex items-center gap-3">
                    <div class="bg-white/20 backdrop-blur-sm p-2 rounded-xl border border-white/10">
                        <span class="material-symbols-outlined text-white" style="font-size: 28px;">mosque</span>
                    </div>
                    <div class="flex flex-col">
                        <p class="text-white/80 text-xs font-medium tracking-wider uppercase">Madrasah</p>
                        <p class="text-white text-lg font-bold leading-none tracking-tight">Al-Hidayah</p>
                    </div>
                </div>
            </div>

            <!-- Title & Subtitle -->
            <div class="flex flex-col gap-1 mb-4">
                <h1 class="text-white text-2xl font-bold tracking-tight">Kalender Akademik</h1>
                <p class="text-white/90 text-sm font-medium opacity-90">Jadwal kegiatan & libur nasional</p>
            </div>
        </div>
    </div>

    <!-- MAIN CARD CONTAINER (Overlapping) -->
    <main class="relative z-20 -mt-16 px-5">
        <div class="bg-white rounded-[32px] shadow-soft border border-slate-100 px-5 pt-2 pb-8">
            <!-- Calendar Header & Filter -->
            <div class="flex flex-col gap-4 py-6 border-b border-slate-50 mb-4">
                <div class="flex items-center justify-between">
                    <h3 class="text-slate-900 text-lg font-bold">Pilih Jadwal</h3>
                    <!-- Class Filter Dropdown -->
                    <div class="relative w-40">
                        <select id="class-filter"
                            class="w-full appearance-none bg-slate-50 border border-slate-200 rounded-xl pl-4 pr-10 py-2 text-slate-700 font-bold text-xs cursor-pointer hover:bg-slate-100 transition-colors focus:outline-none focus:ring-2 focus:ring-primary/20">
                            <option value="">Kalender Umum</option>
                            {% for k in kelas_list %}
                            <option value="{{ k.nama_kelas }}">{{ k.nama_kelas }}</option>
                            {% endfor %}
                        </select>
                        <span
                            class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-[18px]">expand_more</span>
                    </div>
                </div>

                <!-- Month Navigation -->
                <div class="flex items-center justify-between bg-slate-50 rounded-2xl px-4 py-2">
                    <button id="prev-month-btn"
                        class="size-8 flex items-center justify-center text-slate-400 hover:text-primary transition-colors">
                        <span class="material-symbols-outlined">chevron_left</span>
                    </button>
                    <h2 id="month-display" class="text-sm font-bold text-slate-800 text-center">Loading...</h2>
                    <button id="next-month-btn"
                        class="size-8 flex items-center justify-center text-slate-400 hover:text-primary transition-colors">
                        <span class="material-symbols-outlined">chevron_right</span>
                    </button>
                </div>
            </div>

            <!-- Calendar Grid -->
            <!-- Day Names -->
            <div class="grid grid-cols-7 gap-1 text-center mb-2">
                <div class="text-[10px] font-bold text-red-500 uppercase">Ahd</div>
                <div class="text-[10px] font-bold text-slate-400 uppercase">Sen</div>
                <div class="text-[10px] font-bold text-slate-400 uppercase">Sel</div>
                <div class="text-[10px] font-bold text-slate-400 uppercase">Rab</div>
                <div class="text-[10px] font-bold text-slate-400 uppercase">Kam</div>
                <div class="text-[10px] font-bold text-slate-400 uppercase">Jum</div>
                <div class="text-[10px] font-bold text-slate-400 uppercase">Sab</div>
            </div>

            <!-- Days -->
            <div id="calendar-grid"
                class="grid grid-cols-7 gap-y-2 gap-x-1 text-center text-xs font-medium text-slate-800 relative min-h-[300px]">
                <!-- Grid Content will be injected by JS -->
                <div class="col-span-7 flex items-center justify-center text-slate-400 h-64">Loading Calendar...</div>
            </div>

            <!-- Holiday List -->
            <div class="mt-8 border-t border-slate-50 pt-6">
                <h4 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4 px-1">Daftar Libur Bulan Ini
                </h4>
                <div id="holiday-list" class="flex flex-col gap-2">
                    <!-- Holidays will be injected here -->
                </div>
            </div>
        </div>
    </main>

    <!-- Agenda Detail Modal -->
    <div id="agenda-modal" class="fixed inset-0 z-[60] hidden">
        <!-- Backdrop -->
        <div id="modal-backdrop" class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity opacity-0">
        </div>

        <!-- Modal Content Container -->
        <div class="absolute bottom-0 left-0 right-0 p-4 transition-transform translate-y-full" id="modal-container">
            <div class="bg-white rounded-t-[32px] overflow-hidden max-h-[85vh] flex flex-col shadow-2xl">
                <!-- Handle for swipe-down feel -->
                <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto my-3"></div>

                <div class="px-6 pb-8 overflow-y-auto no-scrollbar">
                    <!-- Date Header -->
                    <div class="flex items-center justify-between mb-6">
                        <div>
                            <h3 id="modal-masehi" class="text-xl font-bold text-slate-800 tracking-tight">31 Desember
                                2025</h3>
                            <p id="modal-hijri"
                                class="text-xs font-medium text-slate-500 uppercase tracking-widest mt-0.5">7 Jumada
                                al-Thani 1447 H</p>
                        </div>
                        <button id="close-modal-btn"
                            class="size-10 flex items-center justify-center rounded-xl bg-slate-100 text-slate-400 hover:bg-slate-200 transition-colors">
                            <span class="material-symbols-outlined">close</span>
                        </button>
                    </div>

                    <!-- Layout for Agenda Items -->
                    <div id="modal-agenda-body" class="space-y-4">
                        <!-- Content will be injected by JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav
        class="fixed bottom-0 w-full bg-surface-light/80 backdrop-blur-md border-t border-slate-200 pb-safe pt-2 px-6 flex justify-between items-center z-50 h-20">
        <a class="flex flex-col items-center gap-1 group w-16" href="{{ url_for('index') }}">
            <span
                class="material-symbols-outlined text-slate-400 text-[28px] group-hover:text-primary transition-colors">home</span>
            <span
                class="text-[10px] font-medium text-slate-500 group-hover:text-primary transition-colors">Beranda</span>
        </a>
        <a class="flex flex-col items-center gap-1 group w-16" href="{{ url_for('calendar') }}">
            <!-- Active State -->
            <span
                class="material-symbols-outlined text-primary text-[28px] group-hover:scale-110 transition-transform fill-current">calendar_month</span>
            <span class="text-[10px] font-bold text-primary">Jadwal</span>
        </a>
        <a class="flex flex-col items-center gap-1 group w-16" href="{{ url_for('about') }}">
            <span
                class="material-symbols-outlined text-slate-400 text-[28px] group-hover:text-primary transition-colors">info</span>
            <span
                class="text-[10px] font-medium text-slate-500 group-hover:text-primary transition-colors">Tentang</span>
        </a>
    </nav>
    <script src="{{ url_for('static', filename='js/calendar.js') }}"></script>
    <script src="{{ url_for('static', filename='js/security.js') }}"></script>
</body>

</html>
